<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>👑 Little Prince Memories</title>

<link rel="preconnect"
      href="https://fonts.googleapis.com">

<link rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700&family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,
body{

width:100%;
height:100%;
overflow:hidden;

font-family:'Poppins',sans-serif;

}

body{

background:
linear-gradient(180deg,#0c2d73,#2f63d8,#8ec5ff);

display:flex;

justify-content:center;

align-items:center;

position:relative;

}

/*=============================
Background Glow
=============================*/

body::before{

content:"";

position:absolute;

width:700px;

height:700px;

background:rgba(255,255,255,.15);

border-radius:50%;

filter:blur(120px);

animation:pulse 7s infinite alternate;

}

@keyframes pulse{

from{

transform:scale(.9);

}

to{

transform:scale(1.2);

}

}

/*=============================
Stars
=============================*/

#stars{

position:absolute;

width:100%;

height:100%;

overflow:hidden;

}

.star{

position:absolute;

width:4px;

height:4px;

background:white;

border-radius:50%;

animation:twinkle 2s infinite alternate;

}

@keyframes twinkle{

0%{

opacity:.2;

transform:scale(.5);

}

100%{

opacity:1;

transform:scale(1.6);

}

}

/*=============================
Glass Card
=============================*/

.container{
position:relative;
width:100%;
height:100vh;
padding:70px 30px 28px;
background:rgba(255,255,255,.035);
backdrop-filter:blur(2px);
border:none;
border-radius:0;
box-shadow:none;
display:flex;
flex-direction:column;
justify-content:flex-start;
align-items:center;
z-index:10;
}

/*=============================
Heading
=============================*/

.subtitle{
font-size:25px;
font-weight:600;
color:#fff;
margin-top:0;
text-shadow:0 2px 10px rgba(0,0,0,.18);
}

.title{
font-family:'Baloo 2',cursive;
font-size:58px;
line-height:1.05;
color:white;
text-shadow:0 0 22px rgba(255,255,255,.75);
margin-top:12px;
text-align:center;
}

.description{

font-size:21px;

color:white;

text-align:center;

max-width:900px;

line-height:1.7;

margin-top:10px;

}

/*=============================
Slideshow
=============================*/

/* ==============================
   LARGE PHOTO SLIDER
============================== */

/* ==============================
   1:1 PHOTO FRAME
============================== */

.slider{
    position:relative;

    width:300px;
    height:300px;

    border-radius:30px;

    /* IMPORTANT:
       Do NOT hide the arrows outside */
    overflow:visible;

    background:rgba(105,157,230,.35);

    border:2px solid rgba(255,255,255,.45);

    box-shadow:0 20px 45px rgba(0,0,0,.30);

    margin-top:25px;

    display:flex;
    align-items:center;
    justify-content:center;
}


/* ==============================
   PHOTO
============================== */

.slider img{
    width:100%;
    height:100%;

    border-radius:30px;

    object-fit:cover;
    object-position:center;

    display:block;

    transition:none;
}


/* ==============================
   SMALL MONTH BAR
============================== */

.caption{
    position:absolute;

    left:0;
    bottom:0;

    width:100%;

    padding:9px 15px;

    background:rgba(19,53,108,.85);

    color:white;

    font-size:20px;

    text-align:center;

    font-weight:600;

    border-radius:0 0 26px 26px;

    backdrop-filter:blur(5px);

    z-index:5;
}


/* ==============================
   ARROWS OUTSIDE FRAME
============================== */

.slide-btn{
    position:absolute;

    top:50%;

    width:64px;
    height:64px;

    border:none;
    border-radius:50%;

    background:rgba(255,255,255,.95);

    color:#111;

    font-size:34px;
    font-weight:bold;

    cursor:pointer;

    z-index:20;

    box-shadow:0 8px 25px rgba(0,0,0,.25);

    transition:transform .25s, background .25s;
}


/* LEFT ARROW */

.prev{
    left:-85px;

    transform:translateY(-50%);
}


/* RIGHT ARROW */

.next{
    right:-85px;

    transform:translateY(-50%);
}


/* HOVER */

.prev:hover{
    transform:translateY(-50%) scale(1.12);
    background:white;
}

.next:hover{
    transform:translateY(-50%) scale(1.12);
    background:white;
}
/*=============================
Navigation Buttons
=============================*/

.buttons{
display:flex;
gap:24px;
margin-top:20px;
}

.buttons button{
padding:15px 38px;
border:none;
border-radius:40px;
font-size:18px;
font-weight:600;
cursor:pointer;
transition:.3s;
box-shadow:0 8px 18px rgba(0,0,0,.12);
}

.buttons button:hover{

transform:translateY(-5px);

}

#previousPage{

background:#ffc107;

}

#nextPage{

background:#ff5f6d;

color:white;

}

.music{
position:absolute;
top:28px;
right:32px;
width:62px;
height:62px;
border-radius:50%;
background:rgba(255,255,255,.96);
border:none;
font-size:28px;
cursor:pointer;
box-shadow:0 10px 24px rgba(0,0,0,.22);
z-index:100;
transition:.3s;
}
.music:hover{
transform:scale(1.08);
}


/*=============================
Responsive layout
=============================*/
@media (max-width:900px){
    .container{
        padding:45px 18px 20px;
    }

    .subtitle{
        font-size:20px;
    }

    .title{
        font-size:44px;
    }

    .slider{
        width:88vw;
        height:330px;
        margin-top:28px;
    }

    .buttons{
        gap:12px;
    }

    .buttons button{
        padding:13px 24px;
        font-size:16px;
    }
}

@media (max-height:700px){
    .container{
        padding-top:35px;
    }

    .title{
        font-size:48px;
    }

    .slider{
        height:290px;
        margin-top:22px;
    }

    .buttons{
        margin-top:14px;
    }
}

</style>

</head>
<body>

<!-- ⭐ Background Stars -->
<div id="stars"></div>

<!-- ☁️ Clouds -->
<div class="cloud cloud1"></div>
<div class="cloud cloud2"></div>
<div class="cloud cloud3"></div>

<!-- 🎈 Balloons -->
<div class="balloon balloon1">🎈</div>
<div class="balloon balloon2">🎈</div>
<div class="balloon balloon3">🎈</div>
<div class="balloon balloon4">🎈</div>

<!-- 🦋 Butterflies -->
<div class="butterfly butterfly1">🦋</div>
<div class="butterfly butterfly2">🦋</div>

<!-- 💖 Hearts -->
<div class="heart heart1">💖</div>
<div class="heart heart2">💙</div>
<div class="heart heart3">💛</div>

<!-- ⭐ Sparkles -->
<div class="spark sparkle1">✨</div>
<div class="spark sparkle2">⭐</div>
<div class="spark sparkle3">✨</div>

<!-- 🧸 Teddy -->
<div class="teddy">🧸</div>

<!-- 🎵 Music -->
<button class="music" id="musicBtn">
🎵
</button>

<div class="container">

<div class="subtitle">
📖 Our Beautiful Journey
</div>

<div class="title">
Little Prince's Memories 👑
</div>



<!-- =========================
SLIDESHOW
========================= -->

<div class="slider">

<img id="slideImage"
     src="images/1.jpg"
     alt="Baby Memory">

<div class="caption"
     id="caption">

🌸 Month 1

</div>

<button class="slide-btn prev">

&#10094;

</button>

<button class="slide-btn next">

&#10095;

</button>

</div>

<!-- Navigation -->

<div class="buttons">

<button id="previousPage">

⬅ Celebration

</button>

<button id="nextPage">

Next Game ➜

</button>

</div>

</div>

<audio id="birthdayMusic" autoplay>

<source src="music/birthday.mp3"
type="audio/mp3">

</audio>

<style>

/*==============================
CLOUDS
==============================*/

.cloud{

position:absolute;

background:white;

border-radius:50px;

opacity:.35;

filter:blur(2px);

animation:cloudMove linear infinite;

}

.cloud::before,
.cloud::after{

content:"";

position:absolute;

background:white;

border-radius:50%;

}

.cloud1{

width:180px;

height:60px;

top:80px;

left:-200px;

animation-duration:35s;

}

.cloud1::before{

width:70px;

height:70px;

top:-30px;

left:30px;

}

.cloud1::after{

width:80px;

height:80px;

top:-20px;

right:30px;

}

.cloud2{

width:220px;

height:70px;

top:180px;

left:-300px;

animation-duration:45s;

}

.cloud3{

width:150px;

height:50px;

top:300px;

left:-180px;

animation-duration:40s;

}

@keyframes cloudMove{

from{

transform:translateX(0);

}

to{

transform:translateX(1800px);

}

}

/*==============================
BALLOONS
==============================*/

.balloon{

position:absolute;

font-size:55px;

animation:floatBalloon linear infinite;

}

.balloon1{

left:5%;

bottom:-100px;

animation-duration:16s;

}

.balloon2{

left:20%;

bottom:-140px;

animation-duration:18s;

}

.balloon3{

right:18%;

bottom:-120px;

animation-duration:17s;

}

.balloon4{

right:5%;

bottom:-150px;

animation-duration:19s;

}

@keyframes floatBalloon{

0%{

transform:translateY(0);

}

100%{

transform:translateY(-130vh);

}

}

/*==============================
BUTTERFLIES
==============================*/

.butterfly{

position:absolute;

font-size:38px;

animation:fly 8s ease-in-out infinite;

}

.butterfly1{

left:10%;

top:30%;

}

.butterfly2{

right:10%;

top:55%;

}

@keyframes fly{

0%,100%{

transform:translate(0,0);

}

50%{

transform:translate(80px,-40px);

}

}

/*==============================
HEARTS
==============================*/

.heart{

position:absolute;

font-size:28px;

animation:heartFloat 5s infinite alternate;

}

.heart1{

left:15%;

top:65%;

}

.heart2{

right:18%;

top:30%;

}

.heart3{

left:75%;

top:75%;

}

@keyframes heartFloat{

to{

transform:translateY(-20px);

}

}

/*==============================
SPARKLES
==============================*/

.spark{

position:absolute;

font-size:28px;

animation:twinkleSpark 2s infinite alternate;

}

.sparkle1{

top:20%;

left:80%;

}

.sparkle2{

top:70%;

left:8%;

}

.sparkle3{

top:35%;

right:15%;

}

@keyframes twinkleSpark{

from{

opacity:.3;

transform:scale(.8);

}

to{

opacity:1;

transform:scale(1.4);

}

}

/*==============================
TEDDY
==============================*/

.teddy{

position:absolute;

bottom:15px;

left:20px;

font-size:70px;

animation:bounce 2s infinite;

}

@keyframes bounce{

0%,100%{

transform:translateY(0);

}

50%{

transform:translateY(-15px);

}

}

</style>

<script>
    /*==================================
Create Twinkling Stars
==================================*/

const stars = document.getElementById("stars");

for(let i=0;i<180;i++){

    const star=document.createElement("div");

    star.className="star";

    star.style.left=Math.random()*100+"%";

    star.style.top=Math.random()*100+"%";

    star.style.animationDuration=(1+Math.random()*3)+"s";

    stars.appendChild(star);

}

/*==================================
Slideshow Images
==================================*/

/* ==============================
   IMAGES
============================== */

const images = [

    "images/1.jpg",
    "images/2.jpg",
    "images/3.jpg",
    "images/4.jpg",
    "images/5.jpg",
    "images/6.jpg",
    "images/7.jpg",
    "images/8.jpg",
    "images/9.jpg",
    "images/10.jpg",
    "images/11.jpg",
    "images/12.jpg"

];


/* ==============================
   MONTH CAPTIONS
============================== */

const captions = [

    "👶 Month 1",
    "😊 Month 2",
    "🥰 Month 3",
    "🌈 Month 4",
    "💙 Month 5",
    "⭐ Month 6",
    "🧸 Month 7",
    "🎈 Month 8",
    "✨ Month 9",
    "🎁 Month 10",
    "🥳 Month 11",
    "🎂 Month 12"

];


/* ==============================
   CURRENT IMAGE
============================== */

let current = 0;

const slide = document.getElementById("slideImage");
const caption = document.getElementById("caption");


/* ==============================
   SHOW IMAGE
============================== */

function showSlide(){

    slide.src = images[current];

    caption.innerHTML = captions[current];

}


/* ==============================
   NEXT BUTTON
============================== */

document.querySelector(".next").onclick = function(){

    current++;

    if(current >= images.length){
        current = 0;
    }

    showSlide();

};


/* ==============================
   PREVIOUS BUTTON
============================== */

document.querySelector(".prev").onclick = function(){

    current--;

    if(current < 0){
        current = images.length - 1;
    }

    showSlide();

};


/* ==============================
   KEYBOARD SUPPORT
============================== */

document.addEventListener("keydown", function(e){

    if(e.key === "ArrowRight"){
        document.querySelector(".next").click();
    }

    if(e.key === "ArrowLeft"){
        document.querySelector(".prev").click();
    }

});
/*==================================
Image Click Animation
==================================*/


/*==================================
Music
==================================*/

const music=document.getElementById("birthdayMusic");

const musicBtn=document.getElementById("musicBtn");

let playing=false;

musicBtn.onclick=function(){

if(!playing){

music.play();

musicBtn.innerHTML="🔊";

playing=true;

}

else{

music.pause();

musicBtn.innerHTML="🎵";

playing=false;

}

};

/*==================================
Navigation
==================================*/

document.getElementById("previousPage").onclick=function(){

window.location.href="celebration.html";

};

document.getElementById("nextPage").onclick=function(){

window.location.href="game.html";

};

</script>

</body>

</html>
