<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🎁 A Special Gift</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    font-family:'Poppins',sans-serif;
    background:
        radial-gradient(circle at 50% 20%,rgba(255,255,255,.4),transparent 30%),
        linear-gradient(
            180deg,
            #0758c9 0%,
            #328fe8 40%,
            #8fd6f8 70%,
            #ffe98a 100%
        );

    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
}

/* =========================
   GLITTER
========================= */

#glitter{
    position:absolute;
    inset:0;
    pointer-events:none;
}

.sparkle{
    position:absolute;
    color:white;
    text-shadow:0 0 12px white;
    animation:twinkle 2s infinite alternate;
}

@keyframes twinkle{

    from{
        opacity:.2;
        transform:scale(.5);
    }

    to{
        opacity:1;
        transform:scale(1.4);
    }
}

/* =========================
   CLOUDS
========================= */

.cloud{
    position:absolute;
    width:220px;
    height:60px;
    background:rgba(255,255,255,.7);
    border-radius:50px;
    filter:blur(2px);
}

.cloud::before,
.cloud::after{
    content:"";
    position:absolute;
    background:inherit;
    border-radius:50%;
}

.cloud::before{
    width:90px;
    height:90px;
    left:30px;
    top:-40px;
}

.cloud::after{
    width:110px;
    height:110px;
    right:25px;
    top:-55px;
}

.cloud1{
    top:15%;
    left:-250px;
    animation:moveCloud 35s linear infinite;
}

.cloud2{
    bottom:10%;
    left:-280px;
    animation:moveCloud 45s linear infinite;
}

@keyframes moveCloud{

    from{
        transform:translateX(0);
    }

    to{
        transform:translateX(1700px);
    }
}

/* =========================
   DECORATIONS
========================= */

.decoration{
    position:absolute;
    z-index:2;
}

.moon{
    left:30px;
    top:25px;
    font-size:55px;
    animation:float 3s infinite ease-in-out;
}

.teddy{
    left:35px;
    bottom:25px;
    font-size:60px;
    animation:float 3.5s infinite ease-in-out;
}

.baby{
    right:35px;
    bottom:25px;
    font-size:60px;
    animation:float 4s infinite ease-in-out;
}

.star{
    right:35px;
    top:30px;
    font-size:45px;
    animation:spin 3s infinite ease-in-out;
}

@keyframes float{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-15px);
    }
}

@keyframes spin{

    0%,100%{
        transform:rotate(-10deg) scale(1);
    }

    50%{
        transform:rotate(10deg) scale(1.2);
    }
}

/* =========================
   MAIN
========================= */

.container{
    position:relative;
    z-index:10;

    width:100%;
    height:100vh;

    display:flex;
    flex-direction:column;
    align-items:center;

    padding-top:30px;
}

/* =========================
   TITLE
========================= */

.subtitle{
    color:white;
    font-size:20px;
    font-weight:600;

    text-shadow:0 3px 10px rgba(0,0,0,.25);
}

.title{
    font-family:'Baloo 2',cursive;

    color:white;

    font-size:56px;
    font-weight:800;

    margin-top:-5px;

    text-shadow:
        0 4px 0 #e6aa00,
        0 0 20px rgba(255,255,255,.8);
}

/* =========================
   POLAROID AREA
========================= */

.polaroid-area{
    position:relative;

    width:500px;
    height:440px;

    margin-top:10px;

    display:flex;
    justify-content:center;
    align-items:center;
}

/* =========================
   POLAROID
========================= */

.polaroid{
    position:absolute;

    width:340px;
    height:385px;

    padding:15px;
    padding-bottom:55px;

    background:#fffdf5;

    box-shadow:
        0 18px 35px rgba(0,0,0,.28);

    cursor:pointer;

    transition:
        transform .5s ease,
        opacity .5s ease;

    user-select:none;
}

/* Different crossed/tilted positions */

.polaroid:nth-child(1){
    transform:rotate(-6deg);
}

.polaroid:nth-child(2){
    transform:rotate(5deg);
}

.polaroid:nth-child(3){
    transform:rotate(-4deg);
}

.polaroid:nth-child(4){
    transform:rotate(7deg);
}

.polaroid:nth-child(5){
    transform:rotate(-7deg);
}

.polaroid:hover{
    transform:
        rotate(0deg)
        scale(1.05);
}

/* Image */

.polaroid img{
    width:100%;
    height:300px;

    object-fit:cover;

    display:block;
}

/* Caption */

.caption{
    position:absolute;

    bottom:13px;
    left:0;
    right:0;

    text-align:center;

    font-family:'Baloo 2',cursive;

    font-size:22px;
    font-weight:600;

    color:#27527a;
}

/* =========================
   CLICK EFFECT
========================= */

.polaroid.hide{
    opacity:0;

    transform:
        scale(.7)
        rotate(20deg);

    pointer-events:none;
}

/* =========================
   INSTRUCTION
========================= */

.instruction{
    color:white;

    font-size:16px;
    font-weight:600;

    margin-top:-5px;

    text-shadow:0 2px 8px rgba(0,0,0,.25);
}

/* =========================
   NEXT BUTTON
========================= */

.next-button{
    margin-top:10px;

    border:none;

    padding:12px 28px;

    border-radius:30px;

    background:#ffd21f;

    color:#124b9b;

    font-family:'Poppins',sans-serif;

    font-size:16px;
    font-weight:700;

    cursor:pointer;

    box-shadow:
        0 8px 20px rgba(0,0,0,.2);

    transition:.3s;
}

.next-button:hover{
    transform:
        translateY(-4px)
        scale(1.05);
}

/* =========================
   COUNTER
========================= */

.counter{
    margin-top:5px;

    color:white;

    font-size:14px;

    font-weight:600;
}

/* =========================
   FINAL MESSAGE
========================= */

.final-message{
    position:fixed;

    inset:0;

    z-index:100;

    display:none;

    align-items:center;
    justify-content:center;

    flex-direction:column;

    background:rgba(3,55,130,.75);

    backdrop-filter:blur(8px);
}

.final-message.show{
    display:flex;
}

.final-message .gift{
    font-size:90px;

    animation:bounce 1s infinite;
}

.final-message h2{
    font-family:'Baloo 2',cursive;

    color:white;

    font-size:55px;

    text-shadow:
        0 4px 0 #e6aa00;
}

.final-message p{
    color:white;

    font-size:20px;

    margin-top:5px;
}

@keyframes bounce{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-15px);
    }
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:600px){

    .title{
        font-size:42px;
    }

    .subtitle{
        font-size:16px;
    }

    .polaroid-area{
        width:90vw;
        height:390px;
    }

    .polaroid{
        width:280px;
        height:330px;

        padding:12px;
        padding-bottom:45px;
    }

    .polaroid img{
        height:255px;
    }

    .caption{
        font-size:18px;
    }

}

</style>
</head>

<body>
   <audio id="fireMusic" autoplay loop>
    <source src="music/firee.mp3" type="audio/mpeg">
</audio> 

<!-- Glitter -->
<div id="glitter"></div>

<!-- Clouds -->
<div class="cloud cloud1"></div>
<div class="cloud cloud2"></div>

<!-- Decorations -->
<div class="decoration moon">🌙</div>
<div class="decoration star">⭐</div>
<div class="decoration teddy">🧸</div>
<div class="decoration baby">👶🏻</div>


<div class="container">

   


    <!-- POLAROID AREA -->

    <div class="polaroid-area">

        <div class="polaroid" id="polaroid">

            <img
                id="memoryImage"
                src="images/g4.jpg"
                alt="Memory"
            >

            <div
                class="caption"
                id="memoryCaption"
            >
                💙 Our Little Memory 💙
            </div>

        </div>

    </div>


    <div class="instruction">
        ✨ Click the photo to reveal the next memory ✨
    </div>

    <div class="counter">
        Memory <span id="current">1</span>
        of
        <span id="total">5</span>
    </div>

    <button
        class="next-button"
        id="nextButton"
    >
        💙 Next Memory
    </button>

</div>


<!-- FINAL SCREEN -->

<div
    class="final-message"
    id="finalMessage"
>

    <div class="gift">
        💌
    </div>

    <h2>
        One More Surprise! ✨
    </h2>

    <p>
        A special letter is waiting for you...
    </p>

</div>


<script>

/* =========================================
   PHOTOS
========================================= */

const photos = [

    {
        image:"images/g4.jpg",
        caption:"💙 Our Little Gift 💙"
    },

    {
        image:"images/g2.jpg",
        caption:"✨ A Beautiful Moment ✨"
    },

    {
        image:"images/g5.jpg",
        caption:"🧸 Sweet Little Memories 🧸"
    },

    {
        image:"images/g1.jpg",
        caption:"👑 Our Little Prince 👑"
    },

    {
        image:"images/g3.jpg",
        caption:"💛 A Memory to Treasure 💛"
    }

];


/* =========================================
   VARIABLES
========================================= */

let currentPhoto = 0;

const polaroid =
    document.getElementById("polaroid");

const memoryImage =
    document.getElementById("memoryImage");

const memoryCaption =
    document.getElementById("memoryCaption");

const current =
    document.getElementById("current");

const total =
    document.getElementById("total");

const nextButton =
    document.getElementById("nextButton");

const finalMessage =
    document.getElementById("finalMessage");


total.textContent = photos.length;


/* =========================================
   SHOW NEXT PHOTO
========================================= */

function nextPhoto(){

    /* Cross/fade out current polaroid */

    polaroid.classList.add("hide");

    setTimeout(() => {

        currentPhoto++;

        /* If all photos are finished */

        if(currentPhoto >= photos.length){

            finalMessage.classList.add("show");

            setTimeout(() => {

                window.location.href =
                    "letter.html";

            },2500);

            return;
        }


        /* Change image */

        memoryImage.src =
            photos[currentPhoto].image;

        memoryCaption.textContent =
            photos[currentPhoto].caption;


        current.textContent =
            currentPhoto + 1;


        /* Show new polaroid */

        polaroid.classList.remove("hide");

        /*
           Give each photo a different
           crossed/tilted angle
        */

        const rotations = [
            "-6deg",
            "5deg",
            "-4deg",
            "7deg",
            "-7deg"
        ];

        polaroid.style.transform =
            "rotate(" +
            rotations[currentPhoto] +
            ")";

    },500);
}


/* =========================================
   CLICK PHOTO
========================================= */

polaroid.addEventListener(
    "click",
    nextPhoto
);


/* =========================================
   NEXT BUTTON
========================================= */

nextButton.addEventListener(
    "click",
    nextPhoto
);


/* =========================================
   GLITTER
========================================= */

const glitter =
    document.getElementById("glitter");

for(let i = 0; i < 120; i++){

    const sparkle =
        document.createElement("div");

    sparkle.className =
        "sparkle";

    sparkle.innerHTML =
        Math.random() > .5
        ? "✦"
        : "•";

    sparkle.style.left =
        Math.random() * 100 + "%";

    sparkle.style.top =
        Math.random() * 100 + "%";

    sparkle.style.fontSize =
        (5 + Math.random() * 12) + "px";

    sparkle.style.animationDuration =
        (1 + Math.random() * 3) + "s";

    sparkle.style.animationDelay =
        Math.random() * 3 + "s";

    glitter.appendChild(sparkle);
}

</script>

</body>
</html>
