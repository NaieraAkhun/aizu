<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy 1st Birthday 🎂</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

height:100vh;
overflow:hidden;
font-family:'Poppins',sans-serif;

background:linear-gradient(
180deg,
#183A66,
#2F5E9E,
#5A8FD8,
#D4AF37,
#F5E7A1
);

display:flex;
justify-content:center;
align-items:center;

}

/* Floating Stars */

.stars{

position:absolute;
width:100%;
height:100%;
overflow:hidden;

}

.star{

position:absolute;

width:4px;
height:4px;

background:white;

border-radius:50%;

box-shadow:
0 0 10px white,
0 0 20px gold;

animation:twinkle 2s infinite alternate;

}

/* Clouds */

.cloud{

position:absolute;

background:white;

opacity:.25;

border-radius:100px;

filter:blur(1px);

animation:cloudMove linear infinite;

}

.cloud::before{

content:"";

position:absolute;

background:white;

border-radius:50%;

}

.cloud::after{

content:"";

position:absolute;

background:white;

border-radius:50%;

}

/* Cloud 1 */

.c1{

width:220px;
height:70px;

top:80px;
left:-250px;

animation-duration:45s;

}

.c1::before{

width:80px;
height:80px;

top:-35px;
left:25px;

}

.c1::after{

width:110px;
height:110px;

top:-50px;
right:20px;

}

/* Cloud 2 */

.c2{

width:180px;
height:60px;

top:220px;
left:-200px;

animation-duration:60s;

}

.c2::before{

width:70px;
height:70px;

top:-30px;
left:20px;

}

.c2::after{

width:90px;
height:90px;

top:-40px;
right:15px;

}

/* Main Box */

.container{

position:relative;

z-index:5;

text-align:center;

padding:50px;

width:90%;
max-width:650px;

background:rgba(255,255,255,.12);

backdrop-filter:blur(18px);

border:1px solid rgba(255,255,255,.2);

border-radius:30px;

box-shadow:0 20px 50px rgba(0,0,0,.3);

}

/* Footprints */

.footprints{

font-size:55px;

letter-spacing:15px;

animation:walk 1s infinite;

}

/* Heading */

h1{

margin-top:20px;

font-size:42px;

font-family:'Baloo 2',cursive;

color:white;

}

h2{

margin-top:15px;

font-size:22px;

font-weight:400;

color:white;

}

/* Loading */

.progress{

margin-top:40px;

width:100%;

height:18px;

background:rgba(255,255,255,.25);

border-radius:30px;

overflow:hidden;

}

.bar{

height:100%;

width:0%;

border-radius:30px;

background:linear-gradient(
90deg,
#FFD166,
#FFF5B7,
white
);

animation:load 6s linear forwards;

}

/* Loading Percentage */

#percent{

margin-top:20px;

font-size:24px;

color:white;

font-weight:bold;

}

/* Bottom */

.bottom{

position:absolute;

bottom:30px;

left:50%;

transform:translateX(-50%);

color:white;

font-size:18px;

opacity:.8;

}

/* Animations */

@keyframes load{

0%{

width:0;

}

100%{

width:100%;

}

}

@keyframes walk{

0%{

transform:translateX(-8px);

}

50%{

transform:translateX(8px);

}

100%{

transform:translateX(-8px);

}

}

@keyframes twinkle{

from{

opacity:.3;
transform:scale(.5);

}

to{

opacity:1;
transform:scale(1.5);

}

}

@keyframes cloudMove{

from{

left:-300px;

}

to{

left:110%;

}

}

</style>

</head>

<body>

<div class="stars" id="stars"></div>

<div class="cloud c1"></div>

<div class="cloud c2"></div>

<div class="container">

<div class="footprints">

👣 👣 👣

</div>

<h1>

Loading Beautiful Memories...

</h1>

<h2>

Preparing a magical birthday surprise ✨

</h2>

<div class="progress">

<div class="bar"></div>

</div>

<div id="percent">

0%

</div>

</div>



<script>

// Create Stars

const stars=document.getElementById("stars");

for(let i=0;i<120;i++){

const s=document.createElement("div");

s.className="star";

s.style.left=Math.random()*100+"vw";

s.style.top=Math.random()*100+"vh";

s.style.animationDelay=Math.random()*3+"s";

stars.appendChild(s);

}

// Loading Percentage

let p=0;

const percent=document.getElementById("percent");

const timer=setInterval(()=>{

p++;

percent.innerHTML=p+"%";

if(p>=100){

clearInterval(timer);

}

},60);

// Redirect

setTimeout(()=>{

document.body.style.transition="1s";

document.body.style.opacity="0";

setTimeout(()=>{

window.location.href="welcome.html";

},1000);

},6000);

</script>

</body>
</html>
