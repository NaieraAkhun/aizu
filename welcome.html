<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Welcome Little Prince 👑</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

height:100vh;
overflow:hidden;
font-family:'Poppins',sans-serif;

background:
linear-gradient(
180deg,
#183A66,
#275C94,
#3C78C2,
#CDAA32,
#F8E8A4
);

display:flex;
justify-content:center;
align-items:center;
position:relative;

}

/* Stars */

.star{

position:absolute;

width:4px;
height:4px;

background:white;

border-radius:50%;

box-shadow:
0 0 10px white,
0 0 20px gold;

animation:twinkle 2s infinite alternate;

}

/* Clouds */

.cloud{

position:absolute;

background:white;

opacity:.18;

border-radius:100px;

filter:blur(1px);

animation:cloudMove linear infinite;

}

.cloud::before{

content:"";

position:absolute;

background:white;

border-radius:50%;

}

.cloud::after{

content:"";

position:absolute;

background:white;

border-radius:50%;

}

.cloud1{

width:220px;
height:70px;

top:90px;
left:-220px;

animation-duration:40s;

}

.cloud1::before{

width:80px;
height:80px;

left:30px;
top:-35px;

}

.cloud1::after{

width:100px;
height:100px;

right:20px;
top:-45px;

}

.cloud2{

width:180px;
height:60px;

top:230px;
left:-180px;

animation-duration:60s;

}

.cloud2::before{

width:70px;
height:70px;

left:20px;
top:-30px;

}

.cloud2::after{

width:90px;
height:90px;

right:18px;
top:-40px;

}

/* Balloons */

.balloon{

position:absolute;

bottom:-150px;

width:80px;
height:100px;

border-radius:50%;

animation:floatUp linear infinite;

}

.balloon::after{

content:"";

position:absolute;

width:2px;
height:80px;

background:white;

left:50%;
top:100px;

}

.red{

left:8%;
background:#ff5a5f;
animation-duration:18s;

}

.blue{

left:25%;
background:#4D96FF;
animation-duration:20s;

}

.yellow{

left:72%;
background:#FFD166;
animation-duration:19s;

}

.purple{

left:90%;
background:#9B5DE5;
animation-duration:22s;

}

/* Main Card */

.card{

width:90%;
max-width:900px;

padding:35px 45px;

background:rgba(255,255,255,.12);

backdrop-filter:blur(18px);

border-radius:30px;

border:1px solid rgba(255,255,255,.25);

text-align:center;

box-shadow:0 25px 60px rgba(0,0,0,.35);

z-index:10;

}

/* Crown */

.crown{

font-size:50px;

animation:float 3s infinite;

}

h3{

margin-top:8px;

font-size:22px;

color:#FFE082;

font-family:'Baloo 2',cursive;

}

h1{

margin-top:10px;

font-size:56px;

font-family:'Baloo 2',cursive;

color:white;

text-shadow:
0 5px 20px rgba(0,0,0,.3);

}

h2{

margin-top:10px;

font-size:34px;

color:white;

}

p{

margin-top:20px;

font-size:18px;

line-height:1.6;

color:white;

}

/* Button */

button{

margin-top:25px;

padding:15px 35px;

font-size:20px;

font-weight:bold;

border:none;

border-radius:50px;

cursor:pointer;

background:linear-gradient(
45deg,
#FFD166,
#FFB703
);

color:#183A66;

transition:.4s;

box-shadow:
0 15px 35px rgba(255,193,7,.4);

}

button:hover{

transform:translateY(-8px) scale(1.05);

}

/* Bottom */

.bottom{

position:absolute;

bottom:10px;

font-size:15px;

color:white;

opacity:.8;

}

/* Animations */

@keyframes float{

0%,100%{

transform:translateY(0);

}

50%{

transform:translateY(-15px);

}

}

@keyframes twinkle{

from{

opacity:.3;
transform:scale(.6);

}

to{

opacity:1;
transform:scale(1.4);

}

}

@keyframes cloudMove{

from{

left:-250px;

}

to{

left:110%;

}

}

@keyframes floatUp{

from{

transform:translateY(0);

}

to{

transform:translateY(-130vh);

}

}

@media(max-width:768px){

.card{

padding:25px 20px;

}

h1{

font-size:38px;

}

h2{

font-size:24px;

}

h3{

font-size:18px;

}

p{

font-size:16px;
line-height:1.5;

}

button{

font-size:16px;

padding:12px 28px;

}
.bottom{
    font-size:13px;
}

}

</style>

</head>

<body>

<div class="cloud cloud1"></div>
<div class="cloud cloud2"></div>

<div class="balloon red"></div>
<div class="balloon blue"></div>
<div class="balloon yellow"></div>
<div class="balloon purple"></div>

<div class="card">

<div class="crown">👑</div>

<h3>Welcome to a Magical Celebration</h3>

<h1>Happy 1st Birthday</h1>

<h2>Little Prince Aizan</h2>

<p>
One year ago, you filled our lives with endless happiness,
tiny giggles, warm hugs, and unforgettable memories.
<br><br>
Today, let's celebrate your very first birthday together! 🎂✨
</p>

<button onclick="startJourney()">
🎁 Begin the Journey →
</button>

</div>

<div class="bottom">
Made with ❤️ by Your Loving Family
</div>

<script>

// Create Stars

for(let i=0;i<120;i++){

const star=document.createElement("div");

star.className="star";

star.style.left=Math.random()*100+"vw";

star.style.top=Math.random()*100+"vh";

star.style.animationDelay=Math.random()*2+"s";

document.body.appendChild(star);

}

// Next Page

function startJourney(){

document.body.style.transition=".8s";

document.body.style.opacity="0";

setTimeout(()=>{

window.location.href="countdown.html";

},800);

}

</script>

</body>
</html>
