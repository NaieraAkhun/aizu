<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🎈 Pop the Balloons</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    position:relative;
    font-family:'Poppins',sans-serif;
    background:
        radial-gradient(circle at 50% 20%,rgba(255,255,255,.35),transparent 25%),
        linear-gradient(
            180deg,
            #0757c9 0%,
            #2185e8 38%,
            #71c9f7 68%,
            #ffe98a 100%
        );
}

/* =====================================================
   GLITTER
===================================================== */

#glitter{
    position:absolute;
    inset:0;
    overflow:hidden;
    pointer-events:none;
    z-index:1;
}

.sparkle{
    position:absolute;
    color:white;
    font-size:12px;
    animation: sparkleMove 2s ease-in-out infinite;
    text-shadow:0 0 10px white;
}

@keyframes sparkleMove{

    0%,100%{
        opacity:.2;
        transform:scale(.5) rotate(0deg);
    }

    50%{
        opacity:1;
        transform:scale(1.5) rotate(180deg);
    }
}

/* =====================================================
   CLOUDS
===================================================== */

.cloud{
    position:absolute;
    width:230px;
    height:65px;
    background:rgba(255,255,255,.75);
    border-radius:60px;
    filter:blur(1px);
    opacity:.75;
    z-index:2;
}

.cloud::before,
.cloud::after{
    content:"";
    position:absolute;
    background:inherit;
    border-radius:50%;
}

.cloud::before{
    width:100px;
    height:100px;
    left:35px;
    top:-50px;
}

.cloud::after{
    width:120px;
    height:120px;
    right:25px;
    top:-65px;
}

.cloud1{
    top:12%;
    left:-250px;
    animation:cloudMove1 35s linear infinite;
}

.cloud2{
    top:35%;
    left:-300px;
    transform:scale(.8);
    animation:cloudMove2 45s linear infinite;
}

.cloud3{
    bottom:8%;
    left:-280px;
    transform:scale(1.2);
    animation:cloudMove3 50s linear infinite;
}

@keyframes cloudMove1{

    from{
        transform:translateX(0);
    }

    to{
        transform:translateX(1600px);
    }
}

@keyframes cloudMove2{

    from{
        transform:translateX(0) scale(.8);
    }

    to{
        transform:translateX(1800px) scale(.8);
    }
}

@keyframes cloudMove3{

    from{
        transform:translateX(0) scale(1.2);
    }

    to{
        transform:translateX(1900px) scale(1.2);
    }
}

/* =====================================================
   DECORATIONS
===================================================== */

.decoration{
    position:absolute;
    z-index:3;
    pointer-events:none;
}

.moon{
    top:25px;
    left:30px;
    font-size:55px;
    animation:float 4s ease-in-out infinite;
}

.teddy{
    left:30px;
    bottom:30px;
    font-size:65px;
    animation:float 3s ease-in-out infinite;
}

.baby{
    right:30px;
    bottom:25px;
    font-size:65px;
    animation:float 3.5s ease-in-out infinite;
}

.starBig{
    right:45px;
    top:35px;
    font-size:45px;
    animation:spinStar 3s ease-in-out infinite;
}

@keyframes float{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-15px);
    }
}

@keyframes spinStar{

    0%,100%{
        transform:rotate(-10deg) scale(1);
    }

    50%{
        transform:rotate(10deg) scale(1.2);
    }
}

/* =====================================================
   MAIN CONTAINER
===================================================== */

.game-container{
    position:relative;
    z-index:10;
    width:100%;
    height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding-top:25px;
}

/* =====================================================
   TITLE
===================================================== */

.subtitle{
    color:white;
    font-size:20px;
    font-weight:600;
    text-shadow:0 3px 10px rgba(0,0,0,.25);
}

.title{
    margin-top:-5px;
    font-family:'Baloo 2',cursive;
    font-size:58px;
    font-weight:800;
    color:white;
    text-align:center;
    line-height:1;
    text-shadow:
        0 4px 0 #e6a900,
        0 0 20px rgba(255,255,255,.8);
}

.instruction{
    margin-top:8px;
    padding:8px 25px;
    border-radius:30px;
    background:linear-gradient(90deg,#ffd43b,#fff3a3);
    color:#0757c9;
    font-size:18px;
    font-weight:700;
    box-shadow:0 7px 20px rgba(0,0,0,.15);
}

/* =====================================================
   COUNTER
===================================================== */

.counter{
    margin-top:10px;
    padding:7px 20px;
    border-radius:25px;
    background:rgba(255,255,255,.9);
    color:#0757c9;
    font-size:16px;
    font-weight:700;
    box-shadow:0 5px 15px rgba(0,0,0,.12);
}

/* =====================================================
   BALLOON AREA
===================================================== */

.balloon-area{
    position:relative;
    width:min(1000px,90vw);
    height:58vh;
    margin-top:5px;
}

/* =====================================================
   BALLOONS
===================================================== */

.balloon{
    position:absolute;
    width:110px;
    height:135px;
    border-radius:50% 50% 48% 48%;
    cursor:pointer;
    z-index:20;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:30px;

    box-shadow:
        inset -15px -15px 25px rgba(0,0,0,.12),
        inset 15px 15px 25px rgba(255,255,255,.4),
        0 12px 25px rgba(0,0,0,.18);

    transition:.2s;

    animation:balloonFloat 3s ease-in-out infinite;
}

/* Balloon shine */

.balloon::before{
    content:"";
    position:absolute;
    width:22px;
    height:40px;
    background:rgba(255,255,255,.65);
    border-radius:50%;
    top:20px;
    left:22px;
    transform:rotate(25deg);
}

/* Balloon knot */

.balloon::after{
    content:"";
    position:absolute;
    bottom:-10px;
    width:18px;
    height:18px;
    background:inherit;
    clip-path:polygon(0 0,100% 0,50% 100%);
}

/* Balloon strings */

.string{
    position:absolute;
    width:2px;
    height:90px;
    background:rgba(70,70,70,.5);
    top:130px;
    left:50%;
    transform:translateX(-50%);
}

/* Colors */

.blue{
    background:linear-gradient(145deg,#66c8ff,#1472e8);
}

.yellow{
    background:linear-gradient(145deg,#fff27b,#ffbe17);
}

.pink{
    background:linear-gradient(145deg,#ff9fc5,#ff5f91);
}

.purple{
    background:linear-gradient(145deg,#c39cff,#7355dd);
}

/* Positions */

.b1{
    left:3%;
    top:35%;
    animation-delay:.2s;
}

.b2{
    left:22%;
    top:8%;
    animation-delay:.8s;
}

.b3{
    left:42%;
    top:30%;
    animation-delay:1.1s;
}

.b4{
    right:22%;
    top:7%;
    animation-delay:.5s;
}

.b5{
    right:3%;
    top:35%;
    animation-delay:1.4s;
}

.b6{
    left:31%;
    bottom:2%;
    animation-delay:1.8s;
}

.b7{
    right:32%;
    bottom:0;
    animation-delay:2s;
}

@keyframes balloonFloat{

    0%,100%{
        transform:translateY(0) rotate(-2deg);
    }

    50%{
        transform:translateY(-15px) rotate(3deg);
    }
}

/* Hover */

.balloon:hover{
    transform:scale(1.12);
}

/* =====================================================
   POP ANIMATION
===================================================== */

.balloon.pop{
    animation:popBalloon .45s ease forwards;
}

@keyframes popBalloon{

    0%{
        transform:scale(1);
        opacity:1;
    }

    40%{
        transform:scale(1.3);
    }

    100%{
        transform:scale(0);
        opacity:0;
    }
}

/* =====================================================
   POP PARTICLES
===================================================== */

.pop-particle{
    position:absolute;
    pointer-events:none;
    font-size:25px;
    z-index:50;
    animation:particlePop .8s ease forwards;
}

@keyframes particlePop{

    0%{
        opacity:1;
        transform:translate(0,0) scale(1);
    }

    100%{
        opacity:0;
        transform:translate(var(--x),var(--y)) scale(.2);
    }
}

/* =====================================================
   MESSAGE
===================================================== */

.message{
    position:absolute;
    left:50%;
    bottom:0;
    transform:translateX(-50%);
    padding:10px 25px;
    background:rgba(255,255,255,.9);
    border:2px dashed #ffc400;
    border-radius:20px;
    color:#0757c9;
    font-weight:600;
    text-align:center;
    white-space:nowrap;
}

/* =====================================================
   SUCCESS
===================================================== */

.success{
    position:fixed;
    inset:0;
    z-index:100;
    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    background:rgba(4,55,130,.75);
    backdrop-filter:blur(8px);
}

.success.show{
    display:flex;
}

.success h2{
    font-family:'Baloo 2',cursive;
    font-size:65px;
    color:white;
    text-shadow:0 4px 0 #e6a900;
}

.success p{
    color:white;
    font-size:22px;
    font-weight:600;
}

.gift-icon{
    font-size:100px;
    animation:giftBounce 1s infinite;
}

@keyframes giftBounce{

    0%,100%{
        transform:translateY(0) scale(1);
    }

    50%{
        transform:translateY(-15px) scale(1.1);
    }
}

/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:800px){

    .title{
        font-size:45px;
    }

    .subtitle{
        font-size:16px;
    }

    .instruction{
        font-size:15px;
    }

    .balloon{
        width:80px;
        height:100px;
        font-size:22px;
    }

    .string{
        top:95px;
        height:60px;
    }

    .message{
        font-size:12px;
    }

    .moon,
    .teddy,
    .baby,
    .starBig{
        font-size:35px;
    }
}

@media(max-height:700px){

    .game-container{
        padding-top:10px;
    }

    .title{
        font-size:45px;
    }

    .balloon-area{
        height:55vh;
    }

    .balloon{
        width:80px;
        height:100px;
    }

    .string{
        top:95px;
    }
}

</style>
</head>

<body>

<!-- =====================================================
     GLITTER
===================================================== -->

<div id="glitter"></div>

<!-- =====================================================
     CLOUDS
===================================================== -->

<div class="cloud cloud1"></div>
<div class="cloud cloud2"></div>
<div class="cloud cloud3"></div>

<!-- =====================================================
     DECORATIONS
===================================================== -->

<div class="decoration moon">🌙</div>
<div class="decoration starBig">⭐</div>
<div class="decoration teddy">🧸</div>
<div class="decoration baby">👶🏻</div>

<!-- =====================================================
     MAIN GAME
===================================================== -->

<div class="game-container">

    <div class="subtitle">
        ✨ A Little Surprise Awaits ✨
    </div>

    <div class="title">
        Pop the Balloons 🎈
    </div>

    <div class="instruction">
        🎈 Tap, Pop & Have Fun! 🎈
    </div>

    <div class="counter">
        Balloons left: <span id="count">7</span>
    </div>

    <div class="balloon-area">

        <!-- Balloon 1 -->
        <div class="balloon blue b1" onclick="popBalloon(this)">
            ✨
            <span class="string"></span>
        </div>

        <!-- Balloon 2 -->
        <div class="balloon yellow b2" onclick="popBalloon(this)">
            ⭐
            <span class="string"></span>
        </div>

        <!-- Balloon 3 -->
        <div class="balloon pink b3" onclick="popBalloon(this)">
            💙
            <span class="string"></span>
        </div>

        <!-- Balloon 4 -->
        <div class="balloon yellow b4" onclick="popBalloon(this)">
            💛
            <span class="string"></span>
        </div>

        <!-- Balloon 5 -->
        <div class="balloon blue b5" onclick="popBalloon(this)">
            ☁️
            <span class="string"></span>
        </div>

        <!-- Balloon 6 -->
        <div class="balloon purple b6" onclick="popBalloon(this)">
            👑
            <span class="string"></span>
        </div>

        <!-- Balloon 7 -->
        <div class="balloon blue b7" onclick="popBalloon(this)">
            ✨
            <span class="string"></span>
        </div>

        <div class="message">
            💫 Pop all the balloons to unlock your special gift! 🎁
        </div>

    </div>

</div>

<!-- =====================================================
     SUCCESS SCREEN
===================================================== -->

<div class="success" id="success">

    <div class="gift-icon">
        🎁
    </div>

    <h2>All Balloons Popped! 🎉</h2>

    <p>
        Your special gift is waiting... 💙
    </p>

</div>

<script>

/* =====================================================
   CREATE GLITTER
===================================================== */

const glitter = document.getElementById("glitter");

for(let i = 0; i < 100; i++){

    const sparkle = document.createElement("div");

    sparkle.className = "sparkle";

    sparkle.innerHTML =
        Math.random() > 0.5 ? "✦" : "•";

    sparkle.style.left =
        Math.random() * 100 + "%";

    sparkle.style.top =
        Math.random() * 100 + "%";

    sparkle.style.fontSize =
        (5 + Math.random() * 12) + "px";

    sparkle.style.animationDuration =
        (1 + Math.random() * 3) + "s";

    sparkle.style.animationDelay =
        Math.random() * 3 + "s";

    glitter.appendChild(sparkle);
}


/* =====================================================
   GAME VARIABLES
===================================================== */

let balloonsLeft = 7;


/* =====================================================
   POP SOUND
===================================================== */

function popSound(){

    const audioContext =
        new (window.AudioContext ||
        window.webkitAudioContext)();

    const oscillator =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();

    oscillator.type = "sine";

    oscillator.frequency.setValueAtTime(
        500,
        audioContext.currentTime
    );

    oscillator.frequency.exponentialRampToValueAtTime(
        100,
        audioContext.currentTime + 0.15
    );

    gain.gain.setValueAtTime(
        0.25,
        audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        0.01,
        audioContext.currentTime + 0.15
    );

    oscillator.connect(gain);

    gain.connect(audioContext.destination);

    oscillator.start();

    oscillator.stop(
        audioContext.currentTime + 0.15
    );
}


/* =====================================================
   CREATE POP PARTICLES
===================================================== */

function createParticles(balloon){

    const rect =
        balloon.getBoundingClientRect();

    const symbols = [
        "✨",
        "⭐",
        "💫",
        "💛",
        "💙"
    ];

    for(let i = 0; i < 10; i++){

        const particle =
            document.createElement("div");

        particle.className =
            "pop-particle";

        particle.innerHTML =
            symbols[
                Math.floor(
                    Math.random() * symbols.length
                )
            ];

        particle.style.left =
            rect.left + rect.width / 2 + "px";

        particle.style.top =
            rect.top + rect.height / 2 + "px";

        particle.style.setProperty(
            "--x",
            (Math.random() * 180 - 90) + "px"
        );

        particle.style.setProperty(
            "--y",
            (Math.random() * 180 - 90) + "px"
        );

        document.body.appendChild(particle);

        setTimeout(() => {
            particle.remove();
        }, 800);
    }
}


/* =====================================================
   POP BALLOON
===================================================== */

function popBalloon(balloon){

    /* Prevent clicking twice */

    if(balloon.classList.contains("pop")){
        return;
    }

    /* Play sound */

    popSound();

    /* Create glitter particles */

    createParticles(balloon);

    /* Pop animation */

    balloon.classList.add("pop");

    /* Update counter */

    balloonsLeft--;

    document.getElementById("count").textContent =
        balloonsLeft;

    /* Check if game completed */

    if(balloonsLeft === 0){

        setTimeout(() => {

            document
                .getElementById("success")
                .classList.add("show");

            /* Go to gift.html */

            setTimeout(() => {

                window.location.href =
                    "gift.html";

            }, 2500);

        }, 600);
    }
}

</script>

</body>
</html>
